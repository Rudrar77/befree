{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-muted mb-3">404</div>
    <h3 class="fw-bold mb-3">Resource Not Found</h3>
    <p class="text-muted mb-4">
      {{ error_message or "The requested page or bank statement was not found." }}
    </p>
    <a href="/" class="btn btn-primary px-4">
      <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
